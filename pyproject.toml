[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lembrete-agua"
version = "0.1.0"
description = "Lembretes locais e configuráveis para beber água no Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Gustavo Martins" }]
dependencies = [
    "windows-toasts>=1.3; platform_system == 'Windows'",
]

[project.gui-scripts]
lembrete-agua = "lembrete_agua.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lembrete_agua = ["assets/*.svg"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
