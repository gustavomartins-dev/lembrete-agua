name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0
      - name: Instalar ferramentas e projeto
        run: python -m pip install --upgrade pip pytest ruff && python -m pip install -e .
      - name: Executar lint
        run: ruff check .
      - name: Executar testes
        run: pytest
